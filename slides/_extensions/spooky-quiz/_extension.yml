title: Spooky Quiz
author: Jonathan Jayes
version: 1.0.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    revealjs:
      theme: [default, spooky-quiz.scss]
      width: 1600
      height: 900
      slide-number: false
      transition: fade
      center: true
      controls: false
      progress: true
      # Fonts as on Jonas's 60years page.
      include-in-header:
        - text: |
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap">
      # After-body, not inside a slide: reveal scales .slides with a transform,
      # which would pin position:fixed emoji to the slide instead of the screen.
      include-after-body: emoji.html
    typst:
      papersize: a4
      font-paths: [fonts]
      mainfont: Special Elite
      template-partials:
        - typst-template.typ
        - typst-show.typ
